name: Bug report
description: Report a reproducible problem
body:
  - type: input
    id: environment
    attributes:
      label: TNTMesh, Blender and operating system versions
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps, expected result and actual result
      description: Attach a shareable model if applicable.
    validations:
      required: true
