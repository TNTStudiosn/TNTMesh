name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  blender:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - series: '4.5'
            version: '4.5.17'
          - series: '5.1'
            version: '5.1.2'
          - series: '5.2'
            version: '5.2.4'
    env:
      BLENDER_VERSION: ${{ matrix.version }}
      BLENDER_SERIES: ${{ matrix.series }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ruff==0.15.12
      - run: ruff check .
      - uses: actions/cache@v4
        id: blender-cache
        with:
          path: ~/tntmesh-blender
          key: blender-linux-x64-${{ matrix.version }}
      - if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          archive="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          url="https://download.blender.org/release/Blender${BLENDER_SERIES}"
          curl -fsSL --retry 3 "$url/$archive" -o "$archive"
          curl -fsSL --retry 3 "$url/blender-${BLENDER_VERSION}.sha256" -o blender.sha256
          grep -F " $archive" blender.sha256 | sha256sum --check --strict -
          mkdir -p ~/tntmesh-blender
          tar -xf "$archive" --strip-components=1 -C ~/tntmesh-blender
      - run: sudo apt-get update && sudo apt-get install -y libxi6 libxfixes3 libxkbcommon0 libgl1 libsm6
      - run: echo "$HOME/tntmesh-blender" >> "$GITHUB_PATH"
      - run: blender --background --factory-startup --python-exit-code 1 --python tests/integration.py
      - run: |
          mkdir dist
          blender --factory-startup --command extension validate tntmesh
          blender --factory-startup --command extension build --source-dir tntmesh --output-dir dist
          blender --factory-startup --command extension validate dist/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TNTMesh-Blender-${{ matrix.version }}
          path: dist/*.zip
