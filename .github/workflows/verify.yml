name: Verify
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  blender:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - series: '4.5'
            version: '4.5.17'
          - series: '5.1'
            version: '5.1.2'
          - series: '5.2'
            version: '5.2.4'
          - series: '5.3'
            version: '5.3.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ruff==0.15.12
      - run: ruff check .
      - run: cmp LICENSE tntmesh/LICENSE
      - uses: ./.github/actions/setup-blender
        with:
          series: ${{ matrix.series }}
          version: ${{ matrix.version }}
      - run: blender --background --factory-startup --python-exit-code 1 --python tests/integration.py
      - run: |
          mkdir dist
          blender --factory-startup --command extension validate tntmesh
          blender --factory-startup --command extension build --source-dir tntmesh --output-dir dist
          blender --factory-startup --command extension validate dist/*.zip
      - name: Test installed ZIP
        run: |
          export BLENDER_USER_RESOURCES="$RUNNER_TEMP/tntmesh-profile"
          blender --factory-startup --command extension install-file -r user_default -e dist/*.zip
          TNTMESH_TEST_PACKAGE=bl_ext.user_default.tntmesh \
            blender --background --factory-startup --python-exit-code 1 --python tests/integration.py
      - uses: actions/upload-artifact@v4
        with:
          name: TNTMesh-Blender-${{ matrix.version }}
          path: dist/*.zip
  macos:
    runs-on: macos-15
    env:
      TNTMESH_BLENDER_VERSION: '4.5.17'
      # blender-4.5.17.sha256 from download.blender.org/release/Blender4.5/
      TNTMESH_MACOS_BLENDER_SHA256: 42e93c32d8c7a2eff057139de332fbab029ba21d08163b14269e7c342163e406
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/tntmesh-blender-macos
          key: blender-macos-arm64-${{ env.TNTMESH_BLENDER_VERSION }}-${{ env.TNTMESH_MACOS_BLENDER_SHA256 }}
      - name: Mount verified Blender release
        run: |
          archive="blender-${TNTMESH_BLENDER_VERSION}-macos-arm64.dmg"
          dmg="$HOME/tntmesh-blender-macos/$archive"
          verify() {
            printf '%s  %s\n' "$TNTMESH_MACOS_BLENDER_SHA256" "$1" | shasum -a 256 --check --status
          }
          if [[ ! -f "$dmg" ]] || ! verify "$dmg"; then
            mkdir -p "$(dirname "$dmg")"
            for origin in https://download.blender.org https://mirror.clarkson.edu/blender https://mirror.dotsrc.org/blender; do
              if curl -fsSL --connect-timeout 15 --max-time 180 --retry 2 \
                  "$origin/release/Blender4.5/$archive" -o "$dmg.partial" && verify "$dmg.partial"; then
                mv "$dmg.partial" "$dmg"
                break
              fi
              echo "::warning::Blender download could not be verified from $origin"
            done
          fi
          printf '%s  %s\n' "$TNTMESH_MACOS_BLENDER_SHA256" "$dmg" | shasum -a 256 --check -
          mount="$RUNNER_TEMP/tntmesh-blender"
          mkdir -p "$mount"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg"
          echo "TNTMESH_BLENDER=$mount/Blender.app/Contents/MacOS/Blender" >> "$GITHUB_ENV"
      - name: Test installed ZIP
        run: |
          mkdir dist
          export BLENDER_USER_RESOURCES="$RUNNER_TEMP/tntmesh-profile"
          "$TNTMESH_BLENDER" --factory-startup --command extension build --source-dir tntmesh --output-dir dist
          "$TNTMESH_BLENDER" --factory-startup --command extension validate dist/*.zip
          "$TNTMESH_BLENDER" --factory-startup --command extension install-file -r user_default -e dist/*.zip
          TNTMESH_TEST_PACKAGE=bl_ext.user_default.tntmesh \
            "$TNTMESH_BLENDER" --background --factory-startup --python-exit-code 1 --python tests/integration.py
